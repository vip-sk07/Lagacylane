<title>LegacyLane Memory Ground</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-height 3D stage; floating glass panels at 16px insets; one committed night-stadium look */
:root{--bg:#070b10;--panel:rgba(12,18,26,.84);--line:#2a3945;--fg:#e9eef2;--mute:#92a5b3;--gold:#e9b44c;--teal:#5fe0c8;--rose:#e5637a;--sky:#5fb4e8;
--display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Instrument Sans','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{position:relative;height:100%;min-height:520px}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar{position:absolute;left:16px;right:16px;top:12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;pointer-events:none}
.bar>*{pointer-events:auto}
.brand{font:800 18px var(--display);letter-spacing:-.02em}.brand i{font-style:normal;color:var(--gold)}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--line);backdrop-filter:blur(6px)}
.tabs button{border:0;background:none;padding:7px 13px;border-radius:7px;color:var(--mute);font-weight:600}
.tabs button[aria-selected=true]{background:var(--gold);color:#1a1405}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
.lbl{font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.legend{position:absolute;left:16px;top:60px;display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.legend div{display:flex;gap:8px;align-items:center;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor;background:currentColor}
.list{position:absolute;right:16px;top:60px;bottom:84px;width:240px;padding:10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.item{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:rgba(255,255,255,.03);border-radius:8px;padding:8px 10px}
.item:hover{background:rgba(255,255,255,.08)}.item.on{border-color:var(--gold);background:rgba(233,180,76,.1)}
.item b{display:block;font-weight:600;font-size:13px}.item span.y{font:400 11px var(--mono);color:var(--mute)}
.ctrl{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px}
.btn{border:1px solid var(--line);background:#18232d;padding:8px 14px;border-radius:8px;font-weight:600;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-2px);background:#22323f}.btn.pri{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.hint{position:absolute;left:16px;bottom:16px;color:var(--mute);font-size:12px;max-width:230px}
.card{position:absolute;left:16px;bottom:84px;width:min(360px,calc(100% - 32px));padding:14px;display:flex;flex-direction:column;gap:8px;transform-origin:left bottom;transition:opacity .25s,transform .25s}
.card[hidden]{display:none}
.card canvas{width:100%;height:130px;border-radius:8px;display:block}
.card h3{margin:0;font:800 20px/1.1 var(--display);letter-spacing:-.02em}
.card p{margin:0;color:#c8d4dc}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.form{position:absolute;right:16px;top:60px;width:240px;padding:12px;display:flex;flex-direction:column;gap:8px}
.form input,.form select{background:#0b1218;border:1px solid var(--line);color:var(--fg);padding:8px 10px;border-radius:8px;font:inherit;width:100%}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:8px 14px;border-radius:8px;font-weight:600;z-index:5}
[hidden]{display:none!important}
@media(max-width:820px){.list{top:auto;bottom:70px;left:16px;right:16px;width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px}.item{flex:none}.legend{display:none}.card{bottom:136px}.hint{display:none}.form{top:auto;bottom:70px;left:16px;right:16px;width:auto}.ctrl{bottom:12px}}
</style>

<div class="app" id="app">
  <canvas id="gl"></canvas>
  <div class="bar"><div class="brand">Legacy<i>Lane</i> <span class="lbl" style="margin-left:6px">Alex Morgan · #10</span></div>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-v="ground">Memory ground</button><button role="tab" aria-selected="false" data-v="cabinet">Trophy cabinet</button></div></div>

  <div id="gUI">
    <div class="glass legend"><span class="lbl">Node colour</span>
      <div><span class="dot" style="color:#ffc65a"></span>Win or award</div><div><span class="dot" style="color:#5fe0c8"></span>Training</div>
      <div><span class="dot" style="color:#e5637a"></span>Hard moment</div><div><span class="dot" style="color:#5fb4e8"></span>Journal</div>

      <select id="tt"><option value="gold">Gold cup</option><option value="silver">Silver cup</option><option value="bronze">Bronze cup</option></select>

</div>

<script>
(function(){

/* ---------- reflections for metal: tiny studio environment ---------- */
const envScene=new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.BoxGeometry(60,40,60),new THREE.MeshBasicMaterial({color:0x151a22,side:THREE.BackSide})));

 {y:2012,age:10,t:'Backyard football',type:'journal',imp:.55,mood:8.1,note:'Appa gave me a red ball. We kicked it around until the streetlights came on.'},
 {y:2014,age:12,t:'First school team',type:'train',imp:.65,mood:8.5,note:'Picked for the school team as a striker. Coach said I run like I am late for something.'},

 {y:2017,age:15,t:'U-15 District Cup',type:'win',imp:1,mood:9.1,note:'Two goals against Rivers FC. The whole street came to watch.'},
 {y:2018,age:16,t:'Top scorer award',type:'win',imp:.85,mood:8.8,note:'22 goals in a season. The trophy sat on our TV for a year.'},
 {y:2019,age:17,t:'State final',type:'win',imp:.9,mood:8.6,note:'Runners-up, but the best football I have played.'},
 {y:2020,age:18,t:'Knee injury',type:'hard',imp:.8,mood:3.2,note:'Six months out. I wrote in my journal every night to stay sane.'},
 {y:2022,age:20,t:'Inter-college Cup',type:'win',imp:.9,mood:9.0,note:'Came back stronger. Captain of the college side.'},
 {y:2025,age:23,t:'Championship clutch win',type:'win',imp:1,mood:9.2,note:'Last-minute winner in the final. I thought of the red ball.'}
];
MEM.forEach((m,i)=>{m.x=(i%2?1:-1)*(3.5+(i%3)*1.4);m.z=-10-i*14});

/* ============================================================

   ============================================================ */
const G=new THREE.Scene();G.background=new THREE.Color(0x040810);G.fog=new THREE.FogExp2(0x060f1a,.017);G.environment=ENV;
const gcam=new THREE.PerspectiveCamera(50,1,.1,400);
const turf=tex(512,512,(x,w,h)=>{for(let i=0;i<8;i++){x.fillStyle=i%2?'#2a7a3c':'#33884a';x.fillRect(0,i*h/8,w,h/8)}for(let i=0;i<20000;i++){x.fillStyle=`rgba(${15+Math.random()*30|0},${80+Math.random()*70|0},35,.2)`;x.fillRect(Math.random()*w,Math.random()*h,2,5)}});
turf.wrapS=turf.wrapT=THREE.RepeatWrapping;turf.repeat.set(5,12);
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(70,180),STD({map:turf,roughness:.95}));pitch.rotation.x=-Math.PI/2;pitch.position.set(0,0,-75);pitch.receiveShadow=true;G.add(pitch);
const outer=new THREE.Mesh(new THREE.PlaneGeometry(300,400),STD({color:0x0a1119,roughness:1}));outer.rotation.x=-Math.PI/2;outer.position.set(0,-.03,-75);G.add(outer);
const lineM=new THREE.MeshBasicMaterial({color:0xe8efe9,transparent:true,opacity:.85});
function lineBox(w,d,x,z){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),lineM);m.rotation.x=-Math.PI/2;m.position.set(x,.02,z);G.add(m)}
lineBox(.25,180,-33,-75);lineBox(.25,180,33,-75);lineBox(66,.25,0,15);lineBox(66,.25,0,-165);lineBox(66,.25,0,-75);
const cc=new THREE.Mesh(new THREE.RingGeometry(9,9.25,64),lineM);cc.rotation.x=-Math.PI/2;cc.position.set(0,.02,-75);G.add(cc);
G.add(new THREE.HemisphereLight(0x6f8fb8,0x0a1018,.55));
const moon=new THREE.DirectionalLight(0xbcd4ff,.35);moon.position.set(-20,40,10);G.add(moon);
const follow=new THREE.SpotLight(0xfff0d6,1.5,90,Math.PI/4.5,.7,1);follow.castShadow=true;follow.shadow.mapSize.set(1024,1024);G.add(follow,follow.target);
// stands + floodlights
const crowd=tex(1024,128,(x,w,h)=>{x.fillStyle='#10161e';x.fillRect(0,0,w,h);const c=['#e9b44c','#5fb4e8','#e5637a','#dfe6ea','#2f9e5b','#8a93a0'];for(let i=0;i<5000;i++){x.globalAlpha=.5+Math.random()*.4;x.fillStyle=c[Math.random()*6|0];x.fillRect(Math.random()*w,Math.random()*h,3,4)}});
crowd.wrapS=crowd.wrapT=THREE.RepeatWrapping;crowd.repeat.set(10,1);
[-1,1].forEach(s=>{for(let t=0;t<6;t++){const b=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.2,190),STD({color:0x161e28,roughness:.9}));b.position.set(s*(40+t*2.4),.6+t*1.2,-75);G.add(b);
 const f=new THREE.Mesh(new THREE.PlaneGeometry(190,1.2),new THREE.MeshBasicMaterial({map:crowd,color:0x7a8794}));f.rotation.y=-s*Math.PI/2;f.position.set(s*(40+t*2.4)-s*1.21,1.3+t*1.2,-75);G.add(f)}});
const glowT=tex(128,128,x=>{const q=x.createRadialGradient(64,64,0,64,64,64);q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(.3,'rgba(255,255,255,.4)');q.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=q;x.fillRect(0,0,128,128)});
[-1,1].forEach(s=>[0,-55,-110,-160].forEach(z=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.3,.45,26),STD({color:0x252c35}));p.position.set(s*36,13,z);G.add(p);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0xfff0d0,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));sp.scale.set(14,14,1);sp.position.set(s*36,26,z);G.add(sp)}));
// era banners
const eras=[[0,'AGE 10–12'],[3,'AGE 14–16'],[6,'AGE 17–20'],[8,'AGE 23']];
eras.forEach(([i,txt])=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(512,96,(x,w,h)=>{x.fillStyle='rgba(8,14,20,.0)';x.fillRect(0,0,w,h);x.fillStyle='rgba(255,255,255,.55)';x.font='600 40px monospace';x.textAlign='center';x.fillText(txt,w/2,60)}),transparent:true,depthWrite:false}));sp.scale.set(10,1.9,1);sp.position.set(-24,1.2,MEM[i].z+4);G.add(sp)});

const NODES=[];
function labelSprite(m){return new THREE.Sprite(new THREE.SpriteMaterial({map:tex(512,128,(x,w,h)=>{x.fillStyle='rgba(8,14,20,.8)';x.fillRect(0,0,w,h);x.strokeStyle='#'+COL[m.type].toString(16).padStart(6,'0');x.lineWidth=4;x.strokeRect(2,2,w-4,h-4);
 x.fillStyle='#92a5b3';x.font='600 24px monospace';x.fillText(m.y+' · '+TYPE[m.type].toUpperCase(),18,38);x.fillStyle='#fff';x.font='800 36px sans-serif';x.fillText(m.t.length>24?m.t.slice(0,23)+'…':m.t,18,92)}),transparent:true,depthWrite:false}))}
const beamT=tex(64,256,(x,w,h)=>{const q=x.createLinearGradient(0,0,0,h);q.addColorStop(0,'rgba(255,255,255,0)');q.addColorStop(1,'rgba(255,255,255,.5)');x.fillStyle=q;x.fillRect(0,0,w,h)});
MEM.forEach((m,i)=>{const c=COL[m.type],s=.7+m.imp*.6,bh=3.5+m.imp*5;const g=new THREE.Group();g.position.set(m.x,0,m.z);
 const disk=new THREE.Mesh(new THREE.CircleGeometry(1.8*s,48),new THREE.MeshBasicMaterial({map:glowT,color:c,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.6}));disk.rotation.x=-Math.PI/2;disk.position.y=.04;g.add(disk);
 const rings=[1.2,1.6].map((r,k)=>{const o=new THREE.Mesh(new THREE.TorusGeometry(r*s,.05*s,8,64),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:k?.5:1}));o.rotation.x=-Math.PI/2;o.position.y=.06;g.add(o);return o});
 const beam=new THREE.Mesh(new THREE.CylinderGeometry(.9*s,1.15*s,bh,32,1,true),new THREE.MeshBasicMaterial({map:beamT,color:c,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,opacity:.55}));beam.scale.y=-1;beam.position.y=bh/2;g.add(beam);
 const N=60,pos=new Float32Array(N*3),ph=[];for(let k=0;k<N;k++){const a=Math.random()*6.28,r=Math.random()*.9*s;pos[k*3]=Math.cos(a)*r;pos[k*3+1]=Math.random()*bh;pos[k*3+2]=Math.sin(a)*r;ph.push(.4+Math.random()*.8)}
 const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:c,size:.12,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(pts);
 const pl=new THREE.PointLight(c,.8,9*s,2);pl.position.y=1;g.add(pl);
 const lab=labelSprite(m);lab.scale.set(4.6,1.15,1);lab.position.y=bh+.9;g.add(lab);
 const hit=new THREE.Mesh(new THREE.CylinderGeometry(1.8*s,1.8*s,bh+2,12),new THREE.MeshBasicMaterial({visible:false}));hit.position.y=(bh+2)/2;hit.userData.i=i;g.add(hit);
 G.add(g);NODES.push({g,m,disk,rings,beam,pts,pos,ph,lab,hit,bh,s,pl,scale:1,tgt:1})});
// dotted route
{const d=[];for(let i=0;i<MEM.length-1;i++){const a=MEM[i],b=MEM[i+1];for(let k=0;k<1;k+=.05)d.push(a.x+(b.x-a.x)*k,.07,a.z+(b.z-a.z)*k)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(d,3));G.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffe6a8,size:.22,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.8})))}

/* player */
const P=new THREE.Group();const limbs={};
function part(name,w,h,d,c,x,y,z,pivotY){const piv=new THREE.Group();piv.position.set(x,y,z);const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),STD({color:c,roughness:.65}));m.position.y=-pivotY;m.castShadow=true;piv.add(m);P.add(piv);limbs[name]=piv;return piv}
part('torso',.62,.8,.36,0x3fbf9d,0,1.1,0,0);part('head',.5,.5,.5,0xe6c4a0,0,1.75,0,0);part('hair',.54,.2,.54,0x3b2a1c,0,2.0,0,0);
part('armL',.2,.7,.2,0xe6c4a0,-.42,1.45,0,.3);part('armR',.2,.7,.2,0xe6c4a0,.42,1.45,0,.3);part('legL',.23,.75,.23,0x14213d,-.15,.75,0,.37);part('legR',.23,.75,.23,0x14213d,.15,.75,0,.37);
const num=new THREE.Mesh(new THREE.PlaneGeometry(.42,.42),new THREE.MeshBasicMaterial({map:tex(128,128,x=>{x.fillStyle='#fff';x.font='800 100px Arial';x.textAlign='center';x.fillText('10',64,100)}),transparent:true}));num.position.set(0,1.15,-.19);num.rotation.y=Math.PI;P.add(num);
const ring=new THREE.Mesh(new THREE.CircleGeometry(1,32),new THREE.MeshBasicMaterial({map:glowT,color:0x5fe0c8,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));ring.rotation.x=-Math.PI/2;ring.position.y=.05;P.add(ring);
P.scale.setScalar(1.4);P.position.set(0,0,6);G.add(P);

let sel=-1,walking=false,target=null,tourT=null,manual={x:0,z:0},faceAng=Math.PI;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
function goTo(i){ if(i<0||i>=MEM.length)return;sel=i;const n=MEM[i];target=new THREE.Vector3(n.x+(n.x>0?-2.4:2.4),0,n.z+3.6);walking=true;$('#gcard').hidden=true;buildList()}
function arrive(){walking=false;const m=MEM[sel];const c=$('#gcard');c.hidden=false;
 c.innerHTML=`<div class="row"><span class="tag" style="color:#${COL[m.type].toString(16).padStart(6,'0')}">${TYPE[m.type]}</span><span class="lbl">Memory ${sel+1} of ${MEM.length} · age ${m.age} · ${m.y}</span></div>
 <canvas id="ph" width="640" height="260"></canvas><h3>${m.t}</h3><p>${m.note}</p>
 <div class="row"><span class="tag" style="color:${m.mood>6?'#5fe0c8':'#e5637a'}">Mood ${m.mood}</span><button class="btn" id="o1">Open full memory</button><button class="btn pri" id="o2">Ask my age-${m.age} self</button></div>`;
 const x=$('#ph').getContext('2d');const gr=x.createLinearGradient(0,0,0,260);gr.addColorStop(0,'#20395a');gr.addColorStop(.6,'#f0a15a');gr.addColorStop(.61,'#2f7a44');gr.addColorStop(1,'#1d5a31');x.fillStyle=gr;x.fillRect(0,0,640,260);x.fillStyle='#08101a';for(let k=0;k<12;k++){x.beginPath();x.arc(40+k*48,150+(k%3)*4,11,0,7);x.fill();x.fillRect(32+k*48,160,16,50)}

 }else{
